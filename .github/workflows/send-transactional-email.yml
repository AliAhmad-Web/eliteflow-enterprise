name: Send transactional email

# Railway blocks outbound SMTP (connection timeout to smtp.gmail.com).
# The API dispatches auth emails here over HTTPS; GitHub-hosted runners send
# via Gmail SMTP using repo secrets (no custom domain required).

on:
  repository_dispatch:
    types: [transactional_email]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send mail via Gmail SMTP
        uses: actions/github-script@v7
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MAIL_TO: ${{ github.event.client_payload.to }}
          MAIL_SUBJECT: ${{ github.event.client_payload.subject }}
          MAIL_TEXT: ${{ github.event.client_payload.text }}
          MAIL_HTML: ${{ github.event.client_payload.html }}
        with:
          script: |
            const { execSync } = require('node:child_process');
            execSync('npm install nodemailer@7 --no-save', {
              stdio: 'inherit',
              cwd: process.env.RUNNER_TEMP,
            });
            const nodemailer = require(require('node:path').join(
              process.env.RUNNER_TEMP,
              'node_modules',
              'nodemailer',
            ));

            const host = (process.env.SMTP_HOST || '').trim();
            const user = (process.env.SMTP_USER || '').trim();
            const pass = (process.env.SMTP_PASS || '').replace(/\s+/g, '');
            const from =
              (process.env.EMAIL_FROM || '').trim() ||
              (user ? `EliteFlow <${user}>` : '');
            const to = (process.env.MAIL_TO || '').trim();
            const subject = (process.env.MAIL_SUBJECT || '').trim();
            const text = process.env.MAIL_TEXT || '';
            const html = process.env.MAIL_HTML || text;

            if (!host || !user || !pass || !from || !to || !subject || !text) {
              throw new Error(
                'Missing SMTP secrets or mail payload (to/subject/text/from)',
              );
            }

            const transporter = nodemailer.createTransport({
              host,
              port: Number(process.env.SMTP_PORT || 587),
              secure: false,
              auth: { user, pass },
            });

            await transporter.verify();
            const info = await transporter.sendMail({
              from,
              to,
              subject,
              text,
              html,
            });
            console.log(
              JSON.stringify({
                ok: true,
                messageId: info.messageId || null,
                response: info.response || null,
                to,
              }),
            );
