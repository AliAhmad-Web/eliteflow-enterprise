name: Send transactional email

# Railway blocks outbound SMTP (connection timeout to smtp.gmail.com).
# The API dispatches auth emails here over HTTPS; GitHub-hosted runners send
# via Gmail SMTP using repo secrets (no custom domain required).
#
# Uses Python smtplib (preinstalled on runners) — avoids npm install latency
# that previously caused browser/API client timeouts before mail completed.

on:
  repository_dispatch:
    types: [transactional_email]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send mail via Gmail SMTP
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MAIL_TO: ${{ github.event.client_payload.to }}
          MAIL_SUBJECT: ${{ github.event.client_payload.subject }}
          MAIL_TEXT: ${{ github.event.client_payload.text }}
          MAIL_HTML: ${{ github.event.client_payload.html }}
          MAIL_NONCE: ${{ github.event.client_payload.nonce }}
        run: |
          python3 <<'PY'
          import json, os, re, smtplib, ssl
          from email.message import EmailMessage

          host = (os.environ.get("SMTP_HOST") or "").strip()
          port = int((os.environ.get("SMTP_PORT") or "587").strip() or "587")
          user = (os.environ.get("SMTP_USER") or "").strip()
          # Gmail app passwords may be pasted with spaces
          password = re.sub(r"\s+", "", os.environ.get("SMTP_PASS") or "")
          from_addr = (os.environ.get("EMAIL_FROM") or "").strip() or (
              f"EliteFlow <{user}>" if user else ""
          )
          to_addr = (os.environ.get("MAIL_TO") or "").strip()
          subject = (os.environ.get("MAIL_SUBJECT") or "").strip()
          text = os.environ.get("MAIL_TEXT") or ""
          html = (os.environ.get("MAIL_HTML") or "").strip() or None
          nonce = (os.environ.get("MAIL_NONCE") or "").strip()

          missing = [
              name
              for name, value in (
                  ("SMTP_HOST", host),
                  ("SMTP_USER", user),
                  ("SMTP_PASS", password),
                  ("EMAIL_FROM", from_addr),
                  ("MAIL_TO", to_addr),
                  ("MAIL_SUBJECT", subject),
                  ("MAIL_TEXT", text),
              )
              if not value
          ]
          if missing:
              raise SystemExit(f"Missing SMTP secrets or mail payload: {', '.join(missing)}")

          if not html:
              # Minimal HTML fallback so clients that prefer HTML still render a link.
              escaped = (
                  text.replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )
              html = (
                  "<pre style=\"font-family:system-ui,sans-serif;white-space:pre-wrap\">"
                  f"{escaped}</pre>"
              )

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = from_addr
          msg["To"] = to_addr
          if nonce:
              msg["X-EliteFlow-Nonce"] = nonce
          msg.set_content(text)
          msg.add_alternative(html, subtype="html")

          context = ssl.create_default_context()
          with smtplib.SMTP(host, port, timeout=45) as smtp:
              smtp.ehlo()
              smtp.starttls(context=context)
              smtp.ehlo()
              smtp.login(user, password)
              smtp.send_message(msg)

          print(
              json.dumps(
                  {
                      "ok": True,
                      "to": to_addr,
                      "subject": subject,
                      "nonce": nonce or None,
                  }
              )
          )
          PY
